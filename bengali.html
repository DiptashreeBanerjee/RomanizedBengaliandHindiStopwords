<!DOCTYPE html>
<html lang="bn-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bengali Stopwords</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-file="data/bengali_stopwords.json">
  <header class="top">
    <h1>Bengali Stopwords</h1>
    <p class="sub">Romanized Bengali words</p>
    <a class="btn" href="index.html">Back to home</a>
  </header>
  <main>
    <label for="search">Search the list</label>
    <input id="search" type="search" placeholder="Type a word">
    <p id="count" aria-live="polite">Loading words…</p>
    <div id="words" class="word-grid"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
